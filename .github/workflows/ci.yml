name: CI/CD Automation Build

# Kích hoạt workflow khi có thao tác push hoặc tạo pull_request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Java 17 (phù hợp với cấu hình maven.compiler.release trong pom.xml)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Thực thi Maven build lifecycle (chạy test và đóng gói thành tệp .jar)
      - name: Build with Maven
        run: mvn -B clean package

      # 4. Upload tệp .jar được tạo ra sau khi build thành công
      - name: Upload Build Artifact
        # Chỉ upload artifact nếu các bước trước (đặc biệt là bước build) thành công
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bai03-artifact
          # Đường dẫn trỏ tới tệp .jar được sinh ra trong thư mục target
          path: target/*.jar
          retention-days: 7